# Streamlit watches the project tree to hot-reload on save. data/ holds a
# 561 MB SQLite database and a 34 MB zip, and walking those on every reload
# is enough to leave the page blank with nothing in the terminal.
[server]
fileWatcherType = "poll"
folderWatchDenylist = ["data", "traces", ".cache", ".git", ".venv"]
runOnSave = true

[browser]
gatherUsageStats = false

# Dark by default. The map's basemap is dark too, so a light chrome around it
# looked like a bug rather than a choice.
[theme]
base = "dark"
primaryColor = "#e8483f"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
